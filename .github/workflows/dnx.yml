name: DNX Package

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dnx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package and smoke test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Determine package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require release tags to point to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Restore
        run: dotnet restore LocalCodingMcp.Dnx/LocalCodingMcp.Dnx.csproj

      - name: Pack
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          dotnet pack LocalCodingMcp.Dnx/LocalCodingMcp.Dnx.csproj
          --configuration Release
          --no-restore
          --output artifacts/packages
          -p:Version="$PACKAGE_VERSION"
          -p:ContinuousIntegrationBuild=true

      - name: Validate and exercise package through dnx
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/test-dnx-package.py artifacts/packages "$PACKAGE_VERSION"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: dnx-nuget-${{ steps.version.outputs.version }}
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish to NuGet.org
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download verified packages
        uses: actions/download-artifact@v7
        with:
          name: dnx-nuget-${{ needs.package.outputs.version }}
          path: artifacts/packages

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: dhhieu113

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: >-
          dotnet nuget push
          "artifacts/packages/LocalCodingMcp.Dnx.${PACKAGE_VERSION}.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
