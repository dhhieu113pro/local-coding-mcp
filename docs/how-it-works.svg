<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="How LocalCodingMcp works">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#121a33"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a6e"/>
      <stop offset="100%" stop-color="#152a52"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="cardC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="cardD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="960" height="420" rx="24" fill="url(#bg)"/>
  <text x="480" y="42" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700">How LocalCodingMcp works</text>
  <text x="480" y="68" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Secure local files ↔ MCP server ↔ public HTTPS ↔ ChatGPT / Grok</text>

  <rect x="36" y="110" width="200" height="200" rx="18" fill="url(#cardA)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="136" y="145" text-anchor="middle" fill="#bfdbfe" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">1. YOUR PC</text>
  <text x="136" y="175" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">Project folder</text>
  <text x="136" y="200" text-anchor="middle" fill="#93c5fd" font-family="Consolas, monospace" font-size="11">D:/wslc/workspaces</text>
  <path d="M86 230 h30 l10 10 h48 v48 h-88 z" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="136" y="305" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="11">mounted → /workspace</text>

  <line x1="246" y1="210" x2="286" y2="210" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="296" y="110" width="200" height="200" rx="18" fill="url(#cardB)" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="396" y="145" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">2. DOCKER</text>
  <text x="396" y="175" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">LocalCoding MCP</text>
  <text x="396" y="198" text-anchor="middle" fill="#5eead4" font-family="Consolas, monospace" font-size="11">:5000 /mcp</text>
  <text x="396" y="230" text-anchor="middle" fill="#ccfbf1" font-family="Segoe UI, system-ui, sans-serif" font-size="11">• path sandbox · files</text>
  <text x="396" y="250" text-anchor="middle" fill="#ccfbf1" font-family="Segoe UI, system-ui, sans-serif" font-size="11">• git · shell · search</text>
  <text x="396" y="270" text-anchor="middle" fill="#ccfbf1" font-family="Segoe UI, system-ui, sans-serif" font-size="11">• history · local skills</text>
  <text x="396" y="294" text-anchor="middle" fill="#5eead4" font-family="Consolas, monospace" font-size="10">LoadEnabledSkills</text>

  <line x1="506" y1="210" x2="546" y2="210" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="556" y="110" width="170" height="200" rx="18" fill="url(#cardC)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="641" y="145" text-anchor="middle" fill="#bfdbfe" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">3. TUNNEL</text>
  <text x="641" y="180" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">ngrok</text>
  <text x="641" y="210" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI, system-ui, sans-serif" font-size="11">HTTPS public URL</text>
  <text x="641" y="240" text-anchor="middle" fill="#93c5fd" font-family="Consolas, monospace" font-size="10">…ngrok-free.app</text>
  <text x="641" y="270" text-anchor="middle" fill="#93c5fd" font-family="Consolas, monospace" font-size="10">/mcp</text>
  <text x="641" y="305" text-anchor="middle" fill="#bfdbfe" font-family="Segoe UI, system-ui, sans-serif" font-size="11">inspector :4040</text>

  <line x1="736" y1="210" x2="776" y2="210" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="786" y="110" width="140" height="200" rx="18" fill="url(#cardD)" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="856" y="145" text-anchor="middle" fill="#ddd6fe" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">4. CLIENTS</text>
  <text x="856" y="183" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">ChatGPT / Grok</text>
  <text x="856" y="211" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">other MCP</text>
  <text x="856" y="250" text-anchor="middle" fill="#c4b5fd" font-family="Segoe UI, system-ui, sans-serif" font-size="10">connect → /mcp</text>
  <text x="856" y="274" text-anchor="middle" fill="#c4b5fd" font-family="Consolas, monospace" font-size="9">LoadEnabledSkills</text>
  <text x="856" y="302" text-anchor="middle" fill="#c4b5fd" font-family="Segoe UI, system-ui, sans-serif" font-size="10">then sandboxed tools</text>

  <text x="480" y="360" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="12">Connect → LoadEnabledSkills for coding work → use relevant skills → call sandboxed tools</text>
  <text x="480" y="390" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="11">AllowedRoots only · sensitive files blocked · shell timeout · skill state persisted locally</text>
</svg>
