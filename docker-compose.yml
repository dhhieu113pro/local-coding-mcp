# LocalCodingMcp
#
# Default (MCP only):
#   docker compose up -d
#
# Public HTTPS via ngrok (needs NGROK_AUTHTOKEN in .env):
#   docker compose --profile ngrok up -d
#
# Codebase Memory sidecar:
#   docker compose --profile codebase-memory up -d
#
# Optional:
#   docker compose --profile ide up -d
#   docker compose --profile termux run --rm termux
#
# Windows MCP_WORKSPACE: D:/wslc/workspaces

services:
  local-coding-mcp:
    image: ghcr.io/dhhieu113pro/local-coding-mcp:latest
    container_name: local-coding-mcp
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:5000"
      ASPNETCORE_ENVIRONMENT: Production
      AllowedRoots__0: /workspace
      CommandTimeoutSeconds: "60"
      MaxSearchResults: "100"
      CodebaseMemory__Enabled: ${CODEBASE_MEMORY_PROXY_ENABLED:-true}
      CodebaseMemory__Endpoint: ${CODEBASE_MEMORY_PROXY_ENDPOINT:-http://codebase-memory:9750/mcp}
      CodebaseMemory__ConnectionTimeoutSeconds: ${CODEBASE_MEMORY_PROXY_TIMEOUT_SECONDS:-15}
    volumes:
      - ${MCP_WORKSPACE:-./workspace}:/workspace
      - ${MCP_HISTORY:-./history}:/app/data
    networks:
      - mcp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Code intelligence MCP sidecar — profile: codebase-memory
  # Uses DeusData/codebase-memory-mcp over stdio, bridged to Streamable HTTP.
  # Host endpoint: http://127.0.0.1:9750/mcp
  codebase-memory:
    profiles: ["codebase-memory"]
    build:
      context: .
      dockerfile: docker/codebase-memory/Dockerfile
      args:
        CODEBASE_MEMORY_VERSION: ${CODEBASE_MEMORY_VERSION:-v0.10.8}
        SUPERGATEWAY_VERSION: ${SUPERGATEWAY_VERSION:-3.2.0}
    container_name: local-coding-mcp-codebase-memory
    working_dir: /workspace
    environment:
      CBM_CACHE_DIR: /var/lib/codebase-memory
    volumes:
      - ${MCP_WORKSPACE:-./workspace}:/workspace:ro
      - ${CBM_DATA:-./codebase-memory}:/var/lib/codebase-memory
    ports:
      - "127.0.0.1:${CBM_PORT:-9750}:9750"
    networks:
      - mcp-net
    restart: unless-stopped
    mem_limit: ${CBM_MEMORY_LIMIT:-1g}
    cpus: ${CBM_CPU_LIMIT:-2.0}

  # Public HTTPS via ngrok — profile: ngrok
  # Requires NGROK_AUTHTOKEN in .env
  # ChatGPT Connection → URL → https://<your-ngrok-host>/mcp
  ngrok:
    profiles: ["ngrok"]
    image: ngrok/ngrok:latest
    container_name: local-coding-mcp-ngrok
    depends_on:
      local-coding-mcp:
        condition: service_healthy
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - http
      - local-coding-mcp:5000
      - --log=stdout
    ports:
      - "4040:4040"
    networks:
      - mcp-net
    restart: unless-stopped

  code-server:
    profiles: ["ide"]
    image: codercom/code-server:latest
    container_name: local-coding-mcp-ide
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:-changeme}
    volumes:
      - ${MCP_WORKSPACE:-./workspace}:/home/coder/project
    ports:
      - "8443:8080"
    command:
      - --bind-addr
      - 0.0.0.0:8080
      - --auth
      - password
      - /home/coder/project
    networks:
      - mcp-net
    restart: unless-stopped

  termux:
    profiles: ["termux"]
    image: termux/termux-docker:latest
    container_name: local-coding-mcp-termux
    stdin_open: true
    tty: true
    volumes:
      - ${MCP_WORKSPACE:-./workspace}:/workspace
    working_dir: /workspace
    networks:
      - mcp-net
    command: ["sleep", "infinity"]

networks:
  mcp-net:
    name: mcp-net
    driver: bridge
