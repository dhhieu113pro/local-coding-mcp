# LocalCodingMcp + OpenAI tunnel-client (shared network)
#
# Setup:
#   1. Copy .env.example → .env and fill secrets
#   2. docker compose up -d
#
# Optional profiles:
#   docker compose --profile ide up -d      # code-server
#   docker compose --profile termux run termux   # interactive Termux shell
#
# Windows MCP_WORKSPACE example: D:/wslc/workspaces
# WSL example:                   /home/you/projects

services:
  local-coding-mcp:
    image: ghcr.io/dhhieu113pro/local-coding-mcp:latest
    container_name: local-coding-mcp
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:5000"
      ASPNETCORE_ENVIRONMENT: Production
      AllowedRoots__0: /workspace
      CommandTimeoutSeconds: "60"
      MaxSearchResults: "100"
    volumes:
      - ${MCP_WORKSPACE:-./workspace}:/workspace
    networks:
      - mcp-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  tunnel-client:
    image: ghcr.io/openai/tunnel-client:latest
    container_name: local-coding-mcp-tunnel
    depends_on:
      local-coding-mcp:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY}
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID}
      MCP_SERVER_URL: http://local-coding-mcp:5000/mcp
      LOG_LEVEL: info
      LOG_FORMAT: json
      HEALTH_LISTEN_ADDR: ":8080"
      # Needed so http://127.0.0.1:8080/ui works via published port
      ALLOW_REMOTE_UI: "true"
    networks:
      - mcp-net
    restart: unless-stopped

  # Optional browser IDE
  code-server:
    profiles: ["ide"]
    image: codercom/code-server:latest
    container_name: local-coding-mcp-ide
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:-changeme}
    volumes:
      - ${MCP_WORKSPACE:-./workspace}:/home/coder/project
    ports:
      - "8443:8080"
    command:
      - --bind-addr
      - 0.0.0.0:8080
      - --auth
      - password
      - /home/coder/project
    networks:
      - mcp-net
    restart: unless-stopped

  # Optional Termux test environment (Android-like shell for experiments)
  # Interactive:
  #   docker compose --profile termux run --rm termux
  # Detached (then attach):
  #   docker compose --profile termux up -d termux
  #   docker attach local-coding-mcp-termux
  termux:
    profiles: ["termux"]
    image: termux/termux-docker:latest
    container_name: local-coding-mcp-termux
    stdin_open: true
    tty: true
    volumes:
      # Same host projects visible inside Termux
      - ${MCP_WORKSPACE:-./workspace}:/workspace
    working_dir: /workspace
    networks:
      - mcp-net
    # Keep container alive when started with up -d
    command: ["sleep", "infinity"]

networks:
  mcp-net:
    name: mcp-net
    driver: bridge
