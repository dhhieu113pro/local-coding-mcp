# LocalCodingMcp — run from WSL / Docker Desktop
#
# Option A — pull public image (no build):
#   docker compose pull && docker compose up -d
#
# Option B — build locally:
#   docker compose up --build
#
# MCP endpoint for OpenAI tunnel-client (on the same host):
#   http://127.0.0.1:5000/mcp
#
# Example:
#   export CONTROL_PLANE_API_KEY=sk-...
#   export CONTROL_PLANE_TUNNEL_ID=tunnel_...
#   export MCP_SERVER_URL=http://127.0.0.1:5000/mcp
#   tunnel-client run
#
# Mount your real project folders under /workspace (or change AllowedRoots).

services:
  local-coding-mcp:
    # Public image (auto-published on push to main)
    image: ghcr.io/dhhieu113pro/local-coding-mcp:latest
    # Uncomment to build from source instead:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: local-coding-mcp
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:5000"
      ASPNETCORE_ENVIRONMENT: Production
      AllowedRoots__0: /workspace
      CommandTimeoutSeconds: "60"
      MaxSearchResults: "100"
    volumes:
      # WSL: /home/you/projects  or  /mnt/c/Users/you/Projects
      - ${MCP_WORKSPACE:-./workspace}:/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
