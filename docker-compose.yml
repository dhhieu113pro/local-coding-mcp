# LocalCodingMcp + OpenAI Secure MCP Tunnel (tunnel-client in container)
#
# 1. Export secrets (do not commit):
#    export CONTROL_PLANE_API_KEY=sk-...
#    export CONTROL_PLANE_TUNNEL_ID=tunnel_...
#    export MCP_WORKSPACE=$HOME/projects
#
# 2. Start both services:
#    docker compose up -d
#
# MCP (internal):  http://local-coding-mcp:5000/mcp
# MCP (host):      http://127.0.0.1:5000/mcp
# Tunnel UI:       http://127.0.0.1:8080/ui

services:
  local-coding-mcp:
    image: ghcr.io/dhhieu113pro/local-coding-mcp:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: local-coding-mcp
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:5000"
      ASPNETCORE_ENVIRONMENT: Production
      AllowedRoots__0: /workspace
      CommandTimeoutSeconds: "60"
      MaxSearchResults: "100"
    volumes:
      - ${MCP_WORKSPACE:-./workspace}:/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tunnel-client:
    image: ghcr.io/openai/tunnel-client:latest
    container_name: local-coding-mcp-tunnel
    depends_on:
      local-coding-mcp:
        condition: service_healthy
    environment:
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY}
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID}
      # Reach MCP over the compose network (not localhost)
      MCP_SERVER_URL: http://local-coding-mcp:5000/mcp
      LOG_LEVEL: info
      LOG_FORMAT: json
      HEALTH_LISTEN_ADDR: ":8080"
    ports:
      - "8080:8080"
    restart: unless-stopped
