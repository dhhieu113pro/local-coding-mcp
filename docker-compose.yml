# LocalCodingMcp + OpenAI Secure MCP Tunnel (+ optional code-server)
#
# Required env (do not commit secrets):
#   export CONTROL_PLANE_API_KEY=sk-...
#   export CONTROL_PLANE_TUNNEL_ID=tunnel_...
#   export MCP_WORKSPACE=$HOME/projects
#
# Default (MCP + tunnel):
#   docker compose up -d
#
# Optional browser IDE (code-server):
#   export CODE_SERVER_PASSWORD=your-strong-password
#   docker compose --profile ide up -d
#
# Ports:
#   MCP:        http://127.0.0.1:5000/mcp
#   Tunnel UI:  http://127.0.0.1:8080/ui
#   code-server:http://127.0.0.1:8443  (profile ide only)

services:
  local-coding-mcp:
    image: ghcr.io/dhhieu113pro/local-coding-mcp:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: local-coding-mcp
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:5000"
      ASPNETCORE_ENVIRONMENT: Production
      AllowedRoots__0: /workspace
      CommandTimeoutSeconds: "60"
      MaxSearchResults: "100"
    volumes:
      - ${MCP_WORKSPACE:-./workspace}:/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tunnel-client:
    image: ghcr.io/openai/tunnel-client:latest
    container_name: local-coding-mcp-tunnel
    depends_on:
      local-coding-mcp:
        condition: service_healthy
    environment:
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY}
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID}
      MCP_SERVER_URL: http://local-coding-mcp:5000/mcp
      LOG_LEVEL: info
      LOG_FORMAT: json
      HEALTH_LISTEN_ADDR: ":8080"
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Optional: VS Code in the browser over the same /workspace mount
  # Start with: docker compose --profile ide up -d
  code-server:
    profiles: ["ide"]
    image: codercom/code-server:latest
    container_name: local-coding-mcp-ide
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:-changeme}
    volumes:
      - ${MCP_WORKSPACE:-./workspace}:/home/coder/project
    ports:
      - "8443:8080"
    command:
      - --bind-addr
      - 0.0.0.0:8080
      - --auth
      - password
      - /home/coder/project
    restart: unless-stopped
